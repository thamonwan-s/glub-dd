<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แสดงข้อมูลจาก Google Sheet</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

    <h2>ข้อมูลจาก Google Sheet</h2>
    <div id="loading">กำลังโหลดข้อมูล...</div>
    
    <table id="dataTable" style="display:none;">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const SPREADSHEET_ID = '151hB3s9N7M63IK8guYJslvORuDQIp9W2eunkv_HUBN0'; // ใส่ ID ชีทของคุณที่นี่
        const SHEET_NAME = 'รถบริการตลอดคืน 🌙'; // ใส่ชื่อแท็บภาษาไทยหรืออังกฤษตรงตามในชีท

        async function getGoogleSheetData(sheetId, sheetName = '') {
            let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
            if (sheetName) {
                url += `&sheet=${encodeURIComponent(sheetName)}`;
            }

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("ไม่สามารถดึงข้อมูลได้");
                
                // อ่านข้อมูลกลับมาเป็นข้อความดิบ (ห้ามใช้ res.json())
                const text = await res.text();
                
                // สกัดเอาเฉพาะก้อน JSON { ... } ตัด /*O_o*/ ออกไป
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
                if (!match || !match[1]) throw new Error("รูปแบบข้อมูลไม่ถูกต้อง");

                const data = JSON.parse(match[1]);
                if (!data.table || !data.table.rows) return [];

                // ดึงชื่อคอลัมน์
                const cols = data.table.cols.map(c => (c && c.label) ? c.label : '');

                // แปลงข้อมูลเป็น Array
                return data.table.rows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => {
                        const key = cols[i] || `col_${i}`;
                        obj[key] = cell ? (cell.f !== undefined ? cell.f : cell.v) : '';
                    });
                    return obj;
                });

            } catch (e) {
                console.error("Fetch Error:", e);
                return [];
            }
        }

        async function renderTable() {
            const data = await getGoogleSheetData(SPREADSHEET_ID, SHEET_NAME);
            
            document.getElementById('loading').style.display = 'none';

            if (data.length === 0) {
                alert("ไม่สามารถดึงข้อมูลได้ กรุณาเช็กสิทธิ์การแชร์ของชีทหรือ ID");
                return;
            }

            const table = document.getElementById('dataTable');
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            table.style.display = 'table';

            // สร้าง Header
            const headers = Object.keys(data[0]);
            let headHtml = '<tr>';
            headers.forEach(h => headHtml += `<th>${h || 'ไม่มีชื่อคอลัมน์'}</th>`);
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            // ใส่ Rows
            let bodyHtml = '';
            data.forEach(row => {
                bodyHtml += '<tr>';
                headers.forEach(h => {
                    bodyHtml += `<td>${row[h] !== null ? row[h] : ''}</td>`;
                });
                bodyHtml += '</tr>';
            });
            tbody.innerHTML = bodyHtml;
        }

        renderTable();
    </script>
</body>
</html>
