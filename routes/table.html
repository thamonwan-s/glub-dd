<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แสดงข้อมูลจาก Google Sheet</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

    <h2>ข้อมูลจาก Google Sheet</h2>
    <div id="loading">กำลังโหลดข้อมูล...</div>
    
    <table id="dataTable" style="display:none;">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const SPREADSHEET_ID = '151hB3s9N7M63IK8guYJslvORuDQIp9W2eunkv_HUBN0'; // ใส่ ID ชีทของคุณที่นี่
        const SHEET_NAME = 'รถบริการตลอดคืน 🌙'; // ใส่ชื่อแท็บภาษาไทยหรืออังกฤษตรงตามในชีท

        async function renderSheet() {
            const data = await getGoogleSheetData(SPREADSHEET_ID, SHEET_NAME);
            
            document.getElementById('loading').style.display = 'none';

            if (data.length === 0) {
                alert("ไม่สามารถดึงข้อมูลได้ กรุณาเช็กสิทธิ์การเปิดแชร์ของชีท");
                return;
            }

            // แสดงตาราง
            const table = document.getElementById('dataTable');
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            table.style.display = 'table';

            // 1. สร้างหัวตาราง (Headers)
            const headers = Object.keys(data[0]);
            let headHtml = '<tr>';
            headers.forEach(h => headHtml += `<th>${h || 'ไม่มีชื่อคอลัมน์'}</th>`);
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            // 2. ใส่ข้อมูลในแถวตาราง (Rows)
            let bodyHtml = '';
            data.forEach(row => {
                bodyHtml += '<tr>';
                headers.forEach(h => {
                    bodyHtml += `<td>${row[h] !== null ? row[h] : '-'}</td>`;
                });
                bodyHtml += '</tr>';
            });
            tbody.innerHTML = bodyHtml;
        }

        // ฟังก์ชันดึงข้อมูล GViz
        async function getGoogleSheetData(sheetId, sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            try {
                const res = await fetch(url);
                const text = await res.json ? await res.json() : await res.text();
                const jsonString = text.substring(47, text.length - 2);
                const data = JSON.parse(jsonString);

                const cols = data.table.cols.map(c => c ? c.label : '');
                return data.table.rows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => {
                        obj[cols[i] || `col_${i}`] = cell ? cell.v : null;
                    });
                    return obj;
                });
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        // เรียกใช้งานเมื่อโหลดหน้าเว็บ
        renderSheet();
    </script>
</body>
</html>
