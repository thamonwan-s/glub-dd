<!DOCTYPE html>
<html lang="th" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#">
    <title>Dashboard List UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. ตัวแปรสี (CSS Variables)
           ========================================== */
        :root {
            /* Light Mode Defaults */
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --hover-bg: rgba(0, 0, 0, 0.03);
            --card-bg: #ffffff;
            --badge-bg: rgba(0, 0, 0, 0.04);
            --badge-text: #475569;
            --arrow-color: #94a3b8;
            --btn-active-bg: #e2e8f0;
        }

        [data-theme="dark"] {
            /* Dark Mode Palette */
            --bg-body: #0b0f17;
            --text-main: #ffffff;
            --text-sub: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --hover-bg: rgba(255, 255, 255, 0.03);
            --card-bg: #111827;
            --badge-bg: rgba(255, 255, 255, 0.04);
            --badge-text: #cbd5e1;
            --arrow-color: #475569;
            --btn-active-bg: rgba(255, 255, 255, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            [data-theme="system"] {
                --bg-body: #0b0f17;
                --text-main: #ffffff;
                --text-sub: #64748b;
                --border-color: rgba(255, 255, 255, 0.08);
                --hover-bg: rgba(255, 255, 255, 0.03);
                --card-bg: #111827;
                --badge-bg: rgba(255, 255, 255, 0.04);
                --badge-text: #cbd5e1;
                --arrow-color: #475569;
                --btn-active-bg: rgba(255, 255, 255, 0.15);
            }
        }

        /* ==========================================
           2. Layout & Global Styles
           ========================================== */
        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Kanit', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-sub);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* หัวข้อส่วนบนพร้อมจัดตำแหน่งปุ่มอยู่มุมขวา */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        /* ==========================================
           3. Segmented Control (ปุ่มมุมขวาบน)
           ========================================== */
        .segmented-control {
            display: inline-flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3px;
            border-radius: 9999px;
            gap: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .segment-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .segment-btn:hover {
            color: var(--text-main);
        }

        .segment-btn.active {
            background-color: var(--btn-active-bg);
            color: var(--text-main);
        }

        /* ==========================================
           4. List UI Items
           ========================================== */
        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
            font-size: 0.95rem;
        }

        .list-container {
            display: flex;
            flex-direction: column;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item:hover {
            background-color: var(--hover-bg);
        }

        .item-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 7px;
            flex-shrink: 0;
            background-color: #64748b;
        }
        .status-dot.green { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        .status-dot.red { background-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
        .status-dot.gray { background-color: #64748b; }

        .item-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .item-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border-color);
            color: var(--badge-text);
            background: var(--badge-bg);
        }

        .badge.production {
            border-color: rgba(99, 102, 241, 0.4);
            color: #818cf8;
            background: rgba(99, 102, 241, 0.1);
        }

        .arrow {
            color: var(--arrow-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนหัวข้อ + ปุ่มสลับโหมดมุมขวาบน -->
        <div class="header-bar">
            <h1 class="header-title">รายการข้อมูล</h1>
            <div class="segmented-control">
                <button type="button" class="segment-btn" data-value="system" onclick="changeTheme('system')" title="System">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
                <button type="button" class="segment-btn" data-value="light" onclick="changeTheme('light')" title="Light">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button type="button" class="segment-btn" data-value="dark" onclick="changeTheme('dark')" title="Dark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <div id="loading" class="loading">⏳ กำลังโหลดข้อมูล...</div>
        <div id="listContainer" class="list-container"></div>
    </div>

    <script>
        // ==========================================
        // 1. ระบบจัดการธีม (Theme Script)
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem('user-theme') || 'system';
            setTheme(savedTheme);
        }

        function changeTheme(theme) {
            localStorage.setItem('user-theme', theme);
            setTheme(theme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            document.querySelectorAll('.segment-btn').forEach(btn => {
                if (btn.getAttribute('data-value') === theme) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        initTheme();

        // ==========================================
        // 2. ระบบดึงข้อมูล Google Sheet
        // ==========================================
        const SPREADSHEET_ID = '151hB3s9N7M63IK8guYJslvORuDQIp9W2eunkv_HUBN0'; // ใส่ ID ชีทของคุณที่นี่
        const SHEET_NAME = 'รถบริการตลอดคืน 🌙'; // ใส่ชื่อแท็บภาษาไทยหรืออังกฤษตรงตามในชีท

        async function getGoogleSheetData(sheetId, sheetName = '') {
            let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
            if (sheetName) url += `&sheet=${encodeURIComponent(sheetName)}`;

            try {
                const res = await fetch(url);
                const text = await res.text();
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
                if (!match || !match[1]) return [];

                const data = JSON.parse(match[1]);
                if (!data.table || !data.table.rows) return [];

                const cols = data.table.cols.map(c => (c && c.label) ? c.label : '');

                return data.table.rows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => {
                        const key = cols[i] || `col_${i}`;
                        obj[key] = cell ? (cell.f !== undefined ? cell.f : cell.v) : '';
                    });
                    return obj;
                });
            } catch (e) {
                console.error("Fetch Sheet Error:", e);
                return [];
            }
        }

        async function renderList() {
            const data = await getGoogleSheetData(SPREADSHEET_ID, SHEET_NAME);
            document.getElementById('loading').style.display = 'none';

            if (data.length === 0) {
                document.getElementById('loading').innerText = 'ไม่พบข้อมูล หรือยังไม่ได้เปิดแชร์ชีท';
                document.getElementById('loading').style.display = 'block';
                return;
            }

            const container = document.getElementById('listContainer');
            let html = '';

            data.forEach((item) => {
                const title = item['ชื่อ'] || item['Name'] || item['title'] || Object.values(item)[0] || 'Item';
                const subTitle = item['รายละเอียด'] || item['Detail'] || item['subtitle'] || Object.values(item)[1] || '';
                const link = item['ลิงก์'] || item['Link'] || item['url'] || '#';
                const status = (item['สถานะ'] || item['Status'] || '').toString().toLowerCase();

                let dotClass = 'gray';
                if (status.includes('สำเร็จ') || status.includes('success') || status.includes('active')) dotClass = 'green';
                if (status.includes('ล้มเหลว') || status.includes('fail') || status.includes('error')) dotClass = 'red';

                const badgeText = item['ประเภท'] || item['Badge'] || 'Preview';
                const badgeClass = badgeText.toLowerCase() === 'production' ? 'badge production' : 'badge';

                html += `
                <div class="list-item">
                    <div class="item-left">
                        <div class="status-dot ${dotClass}"></div>
                        <div>
                            <div class="item-title">${title}</div>
                            <div class="item-subtitle">${subTitle}</div>
                        </div>
                    </div>
                    <div class="item-right">
                        <a href="${link}" target="_blank" class="${badgeClass}">${badgeText}</a>
                        <span class="arrow">›</span>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        renderList();
    </script>
</body>
</html>
