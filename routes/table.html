<!DOCTYPE html>
<html lang="th" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#">
    <title>ระบบเช็กตารางเวลารถเมล์</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --hover-bg: rgba(0, 0, 0, 0.03);
            --card-bg: #ffffff;
            --badge-bg: rgba(0, 0, 0, 0.04);
            --badge-text: #475569;
            --arrow-color: #94a3b8;
            --btn-active-bg: #e2e8f0;
            --accent-color: #3b82f6;
        }

        [data-theme="dark"] {
            --bg-body: #0b0f17;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --hover-bg: rgba(255, 255, 255, 0.03);
            --card-bg: #111827;
            --badge-bg: rgba(255, 255, 255, 0.04);
            --badge-text: #cbd5e1;
            --arrow-color: #475569;
            --btn-active-bg: rgba(255, 255, 255, 0.15);
            --accent-color: #60a5fa;
        }

        @media (prefers-color-scheme: dark) {
            [data-theme="system"] {
                --bg-body: #0b0f17;
                --text-main: #ffffff;
                --text-sub: #94a3b8;
                --border-color: rgba(255, 255, 255, 0.08);
                --hover-bg: rgba(255, 255, 255, 0.03);
                --card-bg: #111827;
                --badge-bg: rgba(255, 255, 255, 0.04);
                --badge-text: #cbd5e1;
                --arrow-color: #475569;
                --btn-active-bg: rgba(255, 255, 255, 0.15);
                --accent-color: #60a5fa;
            }
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Kanit', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-sub);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        /* Theme Control Button */
        .segmented-control {
            display: inline-flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3px;
            border-radius: 9999px;
            gap: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .segment-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .segment-btn.active {
            background-color: var(--btn-active-bg);
            color: var(--text-main);
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
        }

        /* Views Switching */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* List UI */
        .list-container {
            display: flex;
            flex-direction: column;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item:hover {
            background-color: var(--hover-bg);
        }

        .item-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 7px;
            flex-shrink: 0;
            background-color: #64748b;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .item-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            color: var(--badge-text);
            background: var(--badge-bg);
            cursor: pointer;
        }

        .badge:hover {
            opacity: 0.8;
        }

        .arrow {
            color: var(--arrow-color);
            font-size: 0.9rem;
        }

        /* Detail View Styles */
        .btn-back {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        .detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .detail-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .detail-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 4px 0;
        }

        .detail-updated {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .stop-block {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
        }

        .stop-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .stop-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stop-name::before {
            content: '📍';
            font-size: 0.85rem;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            font-size: 0.88rem;
            background: var(--hover-bg);
            padding: 12px;
            border-radius: 8px;
        }

        .schedule-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .schedule-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .schedule-time {
            color: var(--text-main);
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <div class="header-bar">
            <h1 class="header-title">ตารางเวลารถเมล์</h1>
            <div class="segmented-control">
                <button type="button" class="segment-btn" data-value="system" onclick="changeTheme('system')" title="System">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
                <button type="button" class="segment-btn" data-value="light" onclick="changeTheme('light')" title="Light">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button type="button" class="segment-btn" data-value="dark" onclick="changeTheme('dark')" title="Dark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <div id="loading" class="loading">⏳ กำลังโหลดข้อมูล...</div>

        <!-- หน้าที่ 1: หน้าหลัก (List View) -->
        <div id="listView" class="view-section active">
            <div id="listContainer" class="list-container"></div>
        </div>

        <!-- หน้าที่ 2: หน้ารายละเอียด (Detail View) -->
        <div id="detailView" class="view-section">
            <button class="btn-back" onclick="showListView()">← ย้อนกลับหน้าหลัก</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ระบบจัดการธีม
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem('user-theme') || 'system';
            setTheme(savedTheme);
        }

        function changeTheme(theme) {
            localStorage.setItem('user-theme', theme);
            setTheme(theme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.segment-btn').forEach(btn => {
                if (btn.getAttribute('data-value') === theme) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        initTheme();

        // Data Storage
        let globalBusData = [];

        // ==========================================
        // 2. ระบบดึงข้อมูล Google Sheet
        // ==========================================
        const SPREADSHEET_ID = '151hB3s9N7M63IK8guYJslvORuDQIp9W2eunkv_HUBN0'; // ใส่ ID ชีทของคุณที่นี่
        const SHEET_NAME = 'รถบริการตลอดคืน 🌙'; // ใส่ชื่อแท็บภาษาไทยหรืออังกฤษตรงตามในชีท

        async function getGoogleSheetData(sheetId, sheetName = '') {
            let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
            if (sheetName) url += `&sheet=${encodeURIComponent(sheetName)}`;

            try {
                const res = await fetch(url);
                const text = await res.text();
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
                if (!match || !match[1]) return [];

                const data = JSON.parse(match[1]);
                if (!data.table || !data.table.rows) return [];

                const rawRows = data.table.rows;
                const busRoutes = [];
                let currentRoute = null;
                let emptyCellCount = 0;

                for (let i = 0; i < rawRows.length; i++) {
                    const row = rawRows[i];
                    
                    // อ่านค่าแต่ละคอลัมน์ A - G
                    const getVal = (idx) => (row.c && row.c[idx] && row.c[idx].v !== null) ? String(row.c[idx].v).trim() : '';

                    const valA = getVal(0); // สายรถ
                    const valB = getVal(1); // ชื่อเส้นทาง
                    const valC = getVal(2); // ป้าย
                    const valD = getVal(3); // เวลา วันธรรมดา
                    const valE = getVal(4); // เวลา เสาร์-อาทิตย์
                    const valF = getVal(5); // เวลา เสาร์-อาทิตย์ (เพิ่มเติม)
                    const valG = getVal(6); // วันอัปเดตล่าสุด

                    if (valA === '') {
                        emptyCellCount++;
                        // หากว่างติดกัน 3 แถว ถือว่าจบข้อมูลทั้งหมด
                        if (emptyCellCount >= 3) break; 
                    } else {
                        emptyCellCount = 0; // เจอข้อมูลใหม่ รีเซ็ตนับว่าง
                    }

                    // ถ้าเจอค่าใน A แสดงว่าเป็น "รถเมล์สายใหม่"
                    if (valA !== '') {
                        if (currentRoute) busRoutes.push(currentRoute);

                        currentRoute = {
                            busNo: valA,
                            routeName: valB,
                            lastUpdated: valG || '',
                            stops: []
                        };
                    }

                    // หากคอลัมน์ C มีชื่อป้าย ให้นับเป็นข้อมูลป้ายของสายนั้นๆ
                    if (currentRoute && valC !== '') {
                        currentRoute.stops.push({
                            stopName: valC,
                            weekdayTime: valD,
                            weekendTime: valE || valF || 'ไม่มีข้อมูล'
                        });

                        // ถ้ามีวันที่อัปเดตบรรทัดไหน ให้เก็บอัปเดตล่าสุดไว้
                        if (valG) currentRoute.lastUpdated = valG;
                    }
                }

                // ดันชุดข้อมูลสายสุดท้ายเข้า Array
                if (currentRoute) busRoutes.push(currentRoute);

                return busRoutes;

            } catch (e) {
                console.error("Fetch Sheet Error:", e);
                return [];
            }
        }

        // ==========================================
        // 3. Render หน้าหลัก (List View)
        // ==========================================
        async function initApp() {
            globalBusData = await getGoogleSheetData(SPREADSHEET_ID, SHEET_NAME);
            document.getElementById('loading').style.display = 'none';

            if (globalBusData.length === 0) {
                document.getElementById('loading').innerText = 'ไม่พบข้อมูล หรือเปิดสิทธิ์ชีทไม่ถูกต้อง';
                document.getElementById('loading').style.display = 'block';
                return;
            }

            const container = document.getElementById('listContainer');
            let html = '';

            globalBusData.forEach((item, index) => {
                const titleText = `${item.busNo} ${item.routeName}`.trim();
                
                // ดึงข้อมูลป้ายแรกมาโชว์ตัวอย่างในหน้าหลัก
                const firstStop = item.stops[0] || { stopName: 'ไม่ระบุป้าย', weekdayTime: '-' };
                const subtitleHtml = `<strong style="font-weight: 600; color: var(--text-main);">${firstStop.stopName}</strong> ${firstStop.weekdayTime}`;

                html += `
                <div class="list-item">
                    <div class="item-left">
                        <div class="status-dot gray"></div>
                        <div>
                            <div class="item-title">${titleText}</div>
                            <div class="item-subtitle">${subtitleHtml}</div>
                        </div>
                    </div>
                    <div class="item-right">
                        <button class="badge" onclick="showDetailView(${index})">More</button>
                        <span class="arrow">›</span>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 4. ระบบสลับหน้า Single Page (List ↔ Detail)
        // ==========================================
        function showDetailView(index) {
            const data = globalBusData[index];
            if (!data) return;

            const contentDiv = document.getElementById('detailContent');
            
            let stopsHtml = '';
            data.stops.forEach((stop) => {
                stopsHtml += `
                <div class="stop-block">
                    <div class="stop-name">${stop.stopName}</div>
                    <div class="schedule-grid">
                        <div class="schedule-item">
                            <span class="schedule-label">🗓️ วันธรรมดา:</span>
                            <span class="schedule-time">${stop.weekdayTime || '-'}</span>
                        </div>
                        <div class="schedule-item" style="margin-top: 6px;">
                            <span class="schedule-label">🏖️ เสาร์ - อาทิตย์ / นักขัตฤกษ์:</span>
                            <span class="schedule-time">${stop.weekendTime || '-'}</span>
                        </div>
                    </div>
                </div>
                `;
            });

            contentDiv.innerHTML = `
                <div class="detail-card">
                    <div class="detail-header">
                        <h2 class="detail-title">${data.busNo} ${data.routeName}</h2>
                        ${data.lastUpdated ? `<div class="detail-updated">อัปเดตล่าสุด: ${data.lastUpdated}</div>` : ''}
                    </div>
                    ${stopsHtml}
                </div>
            `;

            // สลับหน้าจอ
            document.getElementById('listView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('listView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initApp();
    </script>
</body>
</html>
