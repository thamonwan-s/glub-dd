<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glub-DD | กลับดี ๆ ( Be Safe )</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
      //Supabase Connection
      const SUPABASE_URL = 'https://pqjzrjrkoasirbniecly.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd';

      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
      // Create Map
      const map = L.map('map').setView([13.7563,100.5018],12);

      // OpenStreeMap
      L.tileLayer(
        'https://{s}.title.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(map);

      //Load bus stops from Supabase
      async function loadBusStops(){
        const {data, error}=await supabase
          .from('bus_stops')
          .select('*');
        if (error) {
          console.error('Error loading bus stops:'. error);
          return;
        }

        data.forEach(stop => {
          const marker = L.marker([
            stop.lat,
            stop.lng
          ]).addTo(map);

          marker.bindPopup(`
            <b>${stop.name}</b><br>
            Latitude: ${stop.lat}<br>
            Longitude: ${stop.lng}
          `);
        });
      }
      loadBusStops();
      
    </script>
  </body>
</html>
