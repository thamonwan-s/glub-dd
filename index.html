<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glub-DD | กลับดี ๆ ( Be Safe )</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
      // Create Map
      const map = L.map('map').setView([13.7563,100.5018],12);

      // OpenStreeMap
      L.tileLayer(
        'https://{s}.title.openstreetmap.org/{z}/{x}/{y}.png',
        {
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(map);

      //Example marker
      const marker = L.marker([13.7465, 100.5348])
        .addTo(map);
      marker.bindPopup(
        '<b>Example Location</b><br>Latitude: 13.7465<br>Longitude: 100.5348'
      );
    </script>
  </body>
</html>
