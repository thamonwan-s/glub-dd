<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - จัดการสถานที่</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .form-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .preview-box { margin-top: 10px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <h1>หน้าจัดการสถานที่ (Admin)</h1>

    <div class="form-box">
        <h3>เพิ่มป้ายรถเมล์อัตโนมัติ (ด้วย Google Maps Link)</h3>
        <input type="text" id="mapLink" placeholder="วางลิงก์ Google Maps ที่นี่" style="width: 400px; padding: 5px;">
        <button id="saveBtn" onclick="saveData()">ดึงข้อมูลและบันทึก</button>
        <div class="preview-box" id="statusText">สถานะ: พร้อมใช้งาน</div>
    </div>

    <table id="locationTable">
        <thead>
            <tr>
                <th>ชื่อภาษาไทย (TH)</th>
                <th>ชื่อภาษาอังกฤษ (EN)</th>
                <th>Lat</th>
                <th>Lng</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const supabase = supabase.createClient('https://pqjzrjrkoasirbniecly.supabase.co', 'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd');

        async function fetchLocations() {
            const { data } = await supabase.from('bus_stops').select('*');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if(data) {
                data.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td>${item.name_th || item.name || '-'}</td>
                        <td>${item.name_en || '-'}</td>
                        <td>${item.lat}</td>
                        <td>${item.lng}</td>
                        <td><button onclick="deleteRow(${item.id})">ลบ</button></td>
                    </tr>`;
                });
            }
        }

        async function saveData() {
            const link = document.getElementById('mapLink').value;
            const btn = document.getElementById('saveBtn');
            const statusText = document.getElementById('statusText');

            if (!link) return alert("กรุณาวางลิงก์ Google Maps");

            btn.disabled = true;
            statusText.innerText = "สถานะ: กำลังดึงข้อมูลจากลิงก์...";

            try {
                // 1. เรียก Edge Function
                const { data, error } = await supabase.functions.invoke('get-location', { body: { shortLink: link } });
                if (error) throw error;

                const { lat, lng, name_th, name_en } = data;

                statusText.innerText = `สถานะ: พบข้อมูล (${name_th}) กำลังตรวจสอบข้อมูลซ้ำ...`;

                // 2. เช็คซ้ำจากพิกัดหรือชื่อไทย
                const { data: existing } = await supabase.from('bus_stops')
                    .select('id')
                    .or(`name_th.eq."${name_th}",and(lat.eq.${lat},lng.eq.${lng})`);

                if (existing && existing.length > 0) {
                    alert("⚠️ สถานที่นี้มีอยู่แล้วในระบบ!");
                    statusText.innerText = "สถานะ: พบข้อมูลซ้ำ ไม่ได้บันทึก";
                } else {
                    // 3. บันทึกลง Supabase Database
                    const { error: insertErr } = await supabase.from('bus_stops').insert([{ 
                        name_th: name_th,
                        name_en: name_en,
                        lat: lat, 
                        lng: lng 
                    }]);

                    if (insertErr) throw insertErr;

                    alert(`✅ บันทึกสำเร็จ!\n- TH: ${name_th}\n- EN: ${name_en}\n- Lat/Lng: ${lat}, ${lng}`);
                    statusText.innerText = "สถานะ: บันทึกสำเร็จเรียบร้อย";
                    fetchLocations();
                    document.getElementById('mapLink').value = '';
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                statusText.innerText = "สถานะ: เกิดข้อผิดพลาด";
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteRow(id) {
            if(confirm('ยืนยันการลบ?')) {
                await supabase.from('bus_stops').delete().eq('id', id);
                fetchLocations();
            }
        }

        fetchLocations();
    </script>
</body>
</html>
