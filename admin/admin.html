<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - จัดการสถานที่</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .form-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>หน้าจัดการสถานที่ (Admin)</h1>

    <div class="form-box">
        <h3>เพิ่มสถานที่ใหม่ (ด้วย Google Maps Link)</h3>
        <input type="text" id="mapLink" placeholder="วางลิงก์ Google Maps" style="width: 300px;">
        <input type="text" id="placeName" placeholder="ชื่อ (ไทย / อังกฤษ)">
        <input type="text" id="placeType" placeholder="ประเภท">
        <button id="saveBtn" onclick="saveData()">บันทึกข้อมูล</button>
    </div>

    <table id="locationTable">
        <thead>
            <tr>
                <th>ชื่อ</th>
                <th>Lat</th>
                <th>Lng</th>
                <th>ประเภท</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const supabase = supabase.createClient('https://pqjzrjrkoasirbniecly.supabase.co', 'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd');

        async function fetchLocations() {
            const { data } = await supabase.from('bus_stops').select('*');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if(data) {
                data.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td>${item.name}</td>
                        <td>${item.lat}</td>
                        <td>${item.lng}</td>
                        <td>${item.type}</td>
                        <td><button onclick="deleteRow(${item.id})">ลบ</button></td>
                    </tr>`;
                });
            }
        }

        async function saveData() {
            const link = document.getElementById('mapLink').value;
            const name = document.getElementById('placeName').value;
            const type = document.getElementById('placeType').value;
            const btn = document.getElementById('saveBtn');

            if (!link || !name) return alert("กรุณากรอกลิงก์และชื่อให้ครบ");

            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            try {
                const { data, error } = await supabase.functions.invoke('get-location', { body: { shortLink: link } });
                if (error) throw error;
                
                const match = data.fullUrl.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                if (!match) throw new Error("ไม่พบพิกัดในลิงก์");

                const lat = parseFloat(match[1]);
                const lng = parseFloat(match[2]);

                const { data: existing } = await supabase.from('bus_stops')
                    .select('id').or(`name.eq.${name},and(lat.eq.${lat},lng.eq.${lng})`);

                if (existing && existing.length > 0) {
                    alert("⚠️ ข้อมูลนี้มีอยู่แล้วในระบบ!");
                } else {
                    await supabase.from('bus_stops').insert([{ name, lat, lng, type }]);
                    alert("บันทึกสำเร็จ!");
                    fetchLocations();
                    document.getElementById('mapLink').value = '';
                    document.getElementById('placeName').value = '';
                    document.getElementById('placeType').value = '';
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "บันทึกข้อมูล";
            }
        }

        async function deleteRow(id) {
            if(confirm('ยืนยันการลบ?')) {
                await supabase.from('bus_stops').delete().eq('id', id);
                fetchLocations();
            }
        }

        fetchLocations();
    </script>
</body>
</html>
