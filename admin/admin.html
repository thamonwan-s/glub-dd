<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - จัดการสถานที่</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .form-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .preview-box { margin-top: 10px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <h1>หน้าจัดการสถานที่ (Admin)</h1>

    <div class="form-box">
        <h3>เพิ่มป้ายรถเมล์อัตโนมัติ (ด้วย Google Maps Link)</h3>
        <input type="text" id="mapLink" placeholder="วางลิงก์ Google Maps ที่นี่" style="width: 400px; padding: 5px;">
        <button id="saveBtn" onclick="saveData()">ดึงข้อมูลและบันทึก</button>
        <div class="preview-box" id="statusText">สถานะ: พร้อมใช้งาน</div>
    </div>

    <table id="locationTable">
        <thead>
            <tr>
                <th>ชื่อภาษาไทย (TH)</th>
                <th>ชื่อภาษาอังกฤษ (EN)</th>
                <th>Lat</th>
                <th>Lng</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const supabaseClient = supabase.createClient(
            'https://pqjzrjrkoasirbniecly.supabase.co', 
            'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd'
        );

        async function fetchLocations() {
            const { data, error } = await supabaseClient.from('bus_stops').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (error) {
                console.error("Fetch Error:", error);
                return;
            }

            if (data) {
                data.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td>${item.name_th || item.name || '-'}</td>
                        <td>${item.name_en || '-'}</td>
                        <td>${item.lat}</td>
                        <td>${item.lng}</td>
                        <td><button onclick="deleteRow(${item.id})">ลบ</button></td>
                    </tr>`;
                });
            }
        }

        async function saveData() {
            const linkInput = document.getElementById('mapLink');
            const link = linkInput.value.trim();
            const btn = document.getElementById('saveBtn');
            const statusText = document.getElementById('statusText');

            if (!link) return alert("กรุณาวางลิงก์ Google Maps");

            btn.disabled = true;
            statusText.innerText = "สถานะ: กำลังดึงข้อมูลชื่อภาษาไทย...";

            try {
                let clientNameTh = "";

                // ดึงชื่อภาษาไทยผ่าน Proxy Client เพื่อให้อ้างอิงบริบทประเทศไทย
                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(link + '?hl=th')}`;
                    const res = await fetch(proxyUrl);
                    const json = await res.json();
                    
                    if (json.contents) {
                        const matchTh = json.contents.match(/<meta\s+property="og:title"\s+content="([^"]+)"/i) || 
                                        json.contents.match(/<title>(.*?)<\/title>/i);
                        if (matchTh && matchTh[1]) {
                            const parsedName = matchTh[1].split('·')[0].split(' - Google Maps')[0].trim();
                            if (!parsedName.toLowerCase().includes("google maps") && !/^-?\d+\.\d+/.test(parsedName)) {
                                clientNameTh = parsedName;
                            }
                        }
                    }
                } catch (e) {
                    console.log("Client Scraping Bypass Error:", e);
                }

                statusText.innerText = "สถานะ: กำลังสกัดพิกัดและบันทึกลงฐานข้อมูล...";

                // เรียก Edge Function โดยส่งชื่อ clientNameTh ที่แกะได้ไปด้วย
                const { data, error } = await supabaseClient.functions.invoke('get-location', { 
                    body: { shortLink: link, clientNameTh: clientNameTh } 
                });
                
                if (error) throw new Error("Edge Function: " + error.message);
                if (data.error) throw new Error(data.error);

                const { lat, lng, name_th, name_en } = data;

                // บันทึกลงตาราง bus_stops
                const { error: insertErr } = await supabaseClient.from('bus_stops').insert([{ 
                    name_th: name_th,
                    name_en: name_en,
                    lat: lat, 
                    lng: lng 
                }]);

                if (insertErr) throw new Error("Database: " + insertErr.message);

                alert(`✅ บันทึกสำเร็จ!\n\nTH: ${name_th}\nEN: ${name_en}\nLat: ${lat}\nLng: ${lng}`);
                statusText.innerText = "สถานะ: บันทึกสำเร็จเรียบร้อย";
                linkInput.value = '';
                fetchLocations();

            } catch (err) {
                console.error(err);
                alert("เกิดข้อผิดพลาด: " + err.message);
                statusText.innerText = "สถานะ: เกิดข้อผิดพลาด (" + err.message + ")";
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteRow(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                await supabaseClient.from('bus_stops').delete().eq('id', id);
                fetchLocations();
            }
        }

        fetchLocations();
    </script>
</body>
</html>
