<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - จัดการสถานที่</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .form-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .preview-box { margin-top: 10px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <h1>หน้าจัดการสถานที่ (Admin)</h1>

    <div class="form-box">
        <h3>เพิ่มป้ายรถเมล์อัตโนมัติ (ด้วย Google Maps Link)</h3>
        <input type="text" id="mapLink" placeholder="วางลิงก์ Google Maps ที่นี่" style="width: 400px; padding: 5px;">
        <button id="saveBtn" onclick="saveData()">ดึงข้อมูลและบันทึก</button>
        <div class="preview-box" id="statusText">สถานะ: พร้อมใช้งาน</div>
    </div>

    <table id="locationTable">
        <thead>
            <tr>
                <th>ชื่อภาษาไทย (TH)</th>
                <th>ชื่อภาษาอังกฤษ (EN)</th>
                <th>Lat</th>
                <th>Lng</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const supabase = supabase.createClient(
            'https://pqjzrjrkoasirbniecly.supabase.co', 
            'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd'
        );

        async function fetchLocations() {
            const { data } = await supabase.from('bus_stops').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (data) {
                data.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td>${item.name_th || '-'}</td>
                        <td>${item.name_en || '-'}</td>
                        <td>${item.lat}</td>
                        <td>${item.lng}</td>
                        <td><button onclick="deleteRow(${item.id})">ลบ</button></td>
                    </tr>`;
                });
            }
        }

        async function saveData() {
            const linkInput = document.getElementById('mapLink');
            const link = linkInput.value.trim();
            const btn = document.getElementById('saveBtn');
            const statusText = document.getElementById('statusText');

            if (!link) return alert("กรุณาวางลิงก์ Google Maps");

            btn.disabled = true;
            statusText.innerText = "สถานะ: กำลังแกะข้อมูลจากลิงก์...";

            try {
                // 1. เรียกใช้งาน Edge Function
                const { data, error } = await supabase.functions.invoke('get-location', { 
                    body: { shortLink: link } 
                });
                
                if (error) throw new Error(error.message || "ไม่สามารถติดต่อ Edge Function ได้");
                if (data.error) throw new Error(data.error);

                const { lat, lng, name_th, name_en } = data;
                statusText.innerText = `สถานะ: ดึงข้อมูลสำเร็จ (${name_th}) กำลังเช็คข้อมูลซ้ำ...`;

                // 2. ตรวจสอบข้อมูลซ้ำในตาราง bus_stops
                const { data: existing } = await supabase.from('bus_stops')
                    .select('id')
                    .or(`name_th.eq."${name_th}",and(lat.eq.${lat},lng.eq.${lng})`);

                if (existing && existing.length > 0) {
                    alert("⚠️ สถานที่นี้มีอยู่แล้วในระบบ!");
                    statusText.innerText = "สถานะ: พบข้อมูลซ้ำ ไม่ได้บันทึกเพิ่ม";
                } else {
                    // 3. บันทึกลง Supabase Database
                    const { error: insertErr } = await supabase.from('bus_stops').insert([{ 
                        name_th: name_th,
                        name_en: name_en,
                        lat: lat, 
                        lng: lng 
                    }]);

                    if (insertErr) throw insertErr;

                    alert(`✅ บันทึกสำเร็จ!\n\nTH: ${name_th}\nEN: ${name_en}\nLat: ${lat}\nLng: ${lng}`);
                    statusText.innerText = "สถานะ: บันทึกข้อมูลลงฐานข้อมูลเรียบร้อย";
                    linkInput.value = '';
                    fetchLocations();
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                statusText.innerText = "สถานะ: เกิดข้อผิดพลาด (" + err.message + ")";
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteRow(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                await supabase.from('bus_stops').delete().eq('id', id);
                fetchLocations();
            }
        }

        fetchLocations();
    </script>
</body>
</html>
