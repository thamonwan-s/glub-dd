<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - จัดการสถานที่</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; word-break: break-all; }
        .form-box { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>หน้าจัดการสถานที่ (Admin)</h1>

    <div class="form-box">
        <h3>เพิ่มป้ายรถเมล์ (ด้วย Google Maps Link)</h3>
        <input type="text" id="mapLink" placeholder="วางลิงก์ Google Maps ที่นี่" style="width: 400px; padding: 6px;">
        <button id="saveBtn" onclick="saveData()">ดึงข้อมูลและบันทึก</button>
        <div id="statusText" style="margin-top: 8px; color: #666;">สถานะ: พร้อมใช้งาน</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ชื่อภาษาไทย (TH)</th>
                <th>ชื่อภาษาอังกฤษ (EN)</th>
                <th>Lat</th>
                <th>Lng</th>
                <th>ลิงก์แผนที่ (Map Link)</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        const supabaseClient = supabase.createClient(
            'https://pqjzrjrkoasirbniecly.supabase.co', 
            'sb_publishable_fI1FYuTjLp5SotlYIDtnUw_L5CTZAZd'
        );

        // ดึงข้อมูลพร้อมคอลัมน์ map_link มาโชว์ในตาราง
        async function fetchLocations() {
            const { data, error } = await supabaseClient.from('bus_stops').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (error) {
                console.error("Fetch Error:", error);
                return;
            }

            if (data) {
                data.forEach(item => {
                    const linkHtml = item.map_link 
                        ? `<a href="${item.map_link}" target="_blank">เปิดลิงก์</a>` 
                        : '-';

                    tbody.innerHTML += `<tr>
                        <td>${item.name_th || '-'}</td>
                        <td>${item.name_en || '-'}</td>
                        <td>${item.lat}</td>
                        <td>${item.lng}</td>
                        <td>${linkHtml}</td>
                        <td><button onclick="deleteRow(${item.id})">ลบ</button></td>
                    </tr>`;
                });
            }
        }

        async function saveData() {
            const linkInput = document.getElementById('mapLink');
            const originalLink = linkInput.value.trim();
            const btn = document.getElementById('saveBtn');
            const statusText = document.getElementById('statusText');

            if (!originalLink) return alert("กรุณาวางลิงก์ Google Maps");

            btn.disabled = true;
            statusText.innerText = "กำลังสกัดพิกัด...";

            try {
                const { data, error } = await supabaseClient.functions.invoke('get-location', { 
                    body: { shortLink: originalLink } 
                });
                
                if (error || data.error) throw new Error(error?.message || data.error);

                const { lat, lng, name_en } = data;
                let finalTh = "";

                statusText.innerText = "กำลังสกัดชื่อภาษาไทย...";

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=th`);
                    const geo = await res.json();
                    if (geo && geo.display_name) {
                        const parts = geo.display_name.split(',');
                        finalTh = parts[0].trim();
                    }
                } catch (e) {}

                if (!finalTh) finalTh = name_en || `ป้ายรถเมล์ (${lat}, ${lng})`;

                statusText.innerText = "กำลังบันทึกลงฐานข้อมูล...";

                // บันทึกลง Supabase โดยส่งคอลัมน์ map_link ตรงๆ
                const { error: insertErr } = await supabaseClient.from('bus_stops').insert([{ 
                    name_th: finalTh,
                    name_en: name_en,
                    lat: lat, 
                    lng: lng,
                    map_link: originalLink
                }]);

                if (insertErr) throw new Error(insertErr.message);

                alert(`✅ บันทึกสำเร็จ!\n\nTH: ${finalTh}\nEN: ${name_en}\nLink: ${originalLink}`);
                linkInput.value = '';
                fetchLocations();

            } catch (err) {
                console.error("Save Error:", err);
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                btn.disabled = false;
                statusText.innerText = "สถานะ: พร้อมใช้งาน";
            }
        }

        async function deleteRow(id) {
            if (confirm('ยืนยันการลบรายการนี้?')) {
                await supabaseClient.from('bus_stops').delete().eq('id', id);
                fetchLocations();
            }
        }

        fetchLocations();
    </script>
</body>
</html>
